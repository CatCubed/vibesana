# Dev mode: Vite dev server with hot reload instead of the nginx build.
# Run with `make dev`.
services:
  app:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 80 --strictPort"
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: vibesana.local
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
